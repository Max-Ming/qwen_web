<!-- textgen.html -->
{% extends 'base.html' %} {% load static %} {% block content %}
<link rel="stylesheet" href="{% static 'css/text_generation/textgen.css' %}">
<div class="container mt-4" style="max-width: 96%">
    <div class="row">
        <!-- 左侧代码输入框 -->
        <div class="col-6">
            <h5>输入你的问题</h5>
            <label for="codeInput" class="form-label" style="display: none">问题输入</label>
            <textarea id="codeInput" class="form-control" style="height: 250px;"></textarea>
            <div class="test-case">
                <button id="commonBtn" class="btn btn-primary" style="margin-right: 10px;">普通生成</button>
                <button id="ragBtn" class="btn btn-primary">RAG生成</button>
            </div>
            <h5>检索内容</h5>
            <label for="ragOutput" class="form-label" style="display: none">检索输出</label>
            <textarea id="ragOutput" class="form-control" style="height: 150px;"></textarea>
            <h5>Prompt</h5>
            <label for="questionInput" class="form-label" style="display: none">最终输入</label>
            <textarea id="questionInput" class="form-control" style="height: 250px;"></textarea>
            <div class="test-case">
                <button id="generateBtn" class="btn btn-primary" style="margin-right: 10px;">普通推理</button>
                <button id="complexBtn" class="btn btn-primary" style="margin-right: 10px;">复杂推理</button>
                <label for="languageInput" class="form-label" style="display: none">语言选择</label>
                <select id="languageInput" class="form-select custom-select" style="max-width: 150px;">
                        <option value="python">Python</option>
                        <option value="cpp">C++</option>
                        <option value="java">Java</option>
                    </select>
            </div>
        </div>

        <!-- 右侧代码翻译结果 -->
        <div class="col-6">
            <h5>输出结果</h5>
            <!-- 标签内容 -->
            <div class="tab-content active" id="text-result">
                <label for="codeOutput" style="display: none">结果输出</label>
                <textarea id="codeOutput" class="form-control"></textarea>
            </div>
            <div class="tab-content" id="markdown-result">
                <div id="markdownOutput" class="border p-3" style="height: 600px; overflow-y: auto;"></div>
            </div>
            <div class="tab-content" id="code-result">
                <div id="onlyCode" class="border p-3" style="height: 600px; overflow-y: auto;"></div>
            </div>
            <!-- 标签 -->
            <div id="tabs" style="margin-top: 10px;">
                <div class="tab active" data-target="text-result">Raw</div>
                <div class="tab" id="markdownBtn" data-target="markdown-result">Markdown</div>
                <div class="tab" id="codeBtn" data-target="code-result">Code</div>
            </div>
            <!-- 测试用例 -->
            <div class="row" style="margin-top: 10px;">
                <div class="col-6">
                    <div class="test-case">
                        <h5>测试用例输入</h5>
                        <label for="languageSelect" class="form-label" style="display: none">语言选择</label>
                        <select id="languageSelect" class="form-select custom-select" style="max-width: 150px; margin: 0 10px;">
                                <option value="python">Python</option>
                                <option value="cpp">C++</option>
                                <option value="java">Java</option>
                            </select>
                        <button id="runTestBtn" class="btn btn-success">运行测试</button>
                    </div>
                    <textarea id="testInput" class="form-control" placeholder="输入测试用例..."></textarea>
                </div>
                <div class="col-6">
                    <div class="test-case">
                        <h5>测试输出</h5>
                    </div>
                    <textarea id="testOutput" class="form-control" placeholder="测试输出..."></textarea>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="{% static 'js/text_generation/textgen.js' %}"></script>
{% endblock %}
