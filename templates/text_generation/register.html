{% extends 'base.html' %} {% block content %}
<div class="container">
    <h2>注册</h2>
    <form method="post">
        {% csrf_token %}
        <div class="form-group">
            <label for="username">用户名</label>
            <input type="text" name="username" class="form-control" id="username" placeholder="请输入用户名" required>
        </div>
        <div class="form-group">
            <label for="password1">密码</label>
            <input type="password" name="password1" class="form-control" id="password1" placeholder="请输入密码" required>
        </div>
        <div class="form-group">
            <label for="password2">确认密码</label>
            <input type="password" name="password2" class="form-control" id="password2" placeholder="确认密码" required>
        </div>
        <button type="submit" class="btn btn-primary">注册</button>
    </form>

    <!-- 显示错误消息 -->
    {% if form.non_field_errors %}
    <div class="alert alert-danger mt-3">
        <strong>错误：</strong> {% for error in form.non_field_errors %}
        <p>{{ error }}</p>
        {% endfor %}
    </div>
    {% endif %}
</div>
{% endblock %}
